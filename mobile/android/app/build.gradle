plugins { id 'com.android.application' }

dependencies { implementation 'androidx.activity:activity:1.10.1' }

android {
    namespace 'com.adarsh.upsc'
    compileSdk 36
    defaultConfig {
        applicationId 'com.adarsh.upsc'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        if (System.getenv('ANDROID_KEYSTORE_PATH')) {
            release {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
        }
    }
    sourceSets.main.res.srcDirs += layout.buildDirectory.dir('generated/branding/res')
}

// Reuse the website's existing branding without duplicating binary assets in Git.
tasks.register('prepareBranding', Copy) {
    from '../../../public/icon-192.png'
    into layout.buildDirectory.dir('generated/branding/res/drawable-nodpi')
    rename 'icon-192.png', 'app_icon.png'
}
tasks.named('preBuild') { dependsOn 'prepareBranding' }
